[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsmuggle"
dynamic = ["version"]
description = "DNSMuggle: a DNS transfer and detection lab for authorized environments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aviral Bohra" }]
keywords = ["dns", "tunnelling", "lab", "security", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Environment :: X11 Applications",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42",
    "platformdirs>=4",
]

[project.optional-dependencies]
workbench = ["pywebview>=6.1,<7"]
pdf = ["reportlab>=4"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/FattyFussCODES/DNSmuggle"
Repository = "https://github.com/FattyFussCODES/DNSmuggle"

[project.scripts]
dnsmuggle = "app.main:main"
DNSMuggle = "app.main:main"
# Explicit command for the same transfer and receiver window.
dnsmuggle-lab = "app.lab_main:main"
# Optional defensive telemetry workbench.
dnsmuggle-workbench = "app.workbench.desktop:main"
# Alias from before the rename; harmless and keeps old shortcuts working.
dnstunnel-app = "app.main:main"

[tool.setuptools]
packages = ["app", "app.gui", "app.workbench"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.setuptools.package-data]
app = [
    "assets/*.png",
    "assets/*.ico",
    "workbench/web/**/*.html",
    "workbench/web/**/*.css",
    "workbench/web/**/*.js",
    "workbench/web/**/*.svg",
    "workbench/web/**/*.png",
    "workbench/web/**/*.ico",
    "workbench/web/**/*.woff2",
    "workbench/web/**/LUCIDE-LICENSE.txt",
    "workbench/web/**/GEIST-LICENSE.txt",
    "workbench/web/**/JETBRAINS-MONO-LICENSE.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
