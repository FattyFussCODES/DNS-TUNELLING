[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnstunnel-app"
version = "1.0.0"
description = "Lab DNS tunnelling desktop app: send, receive, verify, detect and report file transfers over hand-built DNS queries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aviral Bohra" }]
keywords = ["dns", "tunnelling", "lab", "security", "tkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Environment :: X11 Applications",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
pdf = ["reportlab>=4"]
dev = ["pytest>=8"]

[project.scripts]
dnstunnel-app = "app.main:main"

[tool.setuptools]
packages = ["app", "app.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
