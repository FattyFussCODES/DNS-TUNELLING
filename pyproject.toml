[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsmuggle"
version = "1.0.0"
description = "DNSMuggle: smuggle a file out using only DNS queries. Lab app with send, receive, verify, detect and report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aviral Bohra" }]
keywords = ["dns", "tunnelling", "lab", "security", "tkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Environment :: X11 Applications",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
pdf = ["reportlab>=4"]
dev = ["pytest>=8"]

[project.scripts]
dnsmuggle = "app.main:main"
# Alias from before the rename; harmless and keeps old shortcuts working.
dnstunnel-app = "app.main:main"

[tool.setuptools]
packages = ["app", "app.gui"]

[tool.setuptools.package-data]
app = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
